<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>好森嚴選 ✦ 五月號商品登記</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --green:#2d6a4f;--green-dark:#1b4332;--green-mid:#40916c;
  --green-light:#74c69d;--green-pale:#d8f3dc;--green-faint:#f0fbf3;
  --red:#c0392b;--gray:#6b7280;--gray-l:#e5e7eb;--bg:#f4f7f4;
}
body{font-family:-apple-system,'Noto Sans TC','PingFang TC',sans-serif;background:var(--bg);color:#1a2e1a;padding-bottom:130px}
.hdr{background:var(--green-dark);color:white;padding:14px 16px 12px;position:sticky;top:0;z-index:50}
.hdr-title{font-size:19px;font-weight:700;letter-spacing:.04em}
.hdr-sub{font-size:11px;opacity:.6;margin-top:2px}
.hdr-note{font-size:11px;background:rgba(255,255,255,.1);border-radius:6px;padding:6px 10px;margin-top:8px;color:rgba(255,255,255,.8);line-height:1.55}
.flyer-block{background:#111}
.flyer-img{width:100%;display:block;cursor:zoom-in}
.flyer-caption{background:#222;color:rgba(255,255,255,.5);font-size:11px;text-align:center;padding:6px;letter-spacing:.04em}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:300;display:none;align-items:center;justify-content:center;cursor:zoom-out;padding:8px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.brand-block{margin:14px 12px 0}
.brand-hdr{background:var(--green-dark);color:white;border-radius:10px 10px 0 0;padding:9px 14px;display:flex;align-items:center;gap:8px}
.brand-name{font-size:14px;font-weight:700}
.brand-desc{font-size:10.5px;opacity:.6;margin-left:auto;text-align:right;line-height:1.35}
.prod-list{background:white;border-radius:0 0 10px 10px;border:1px solid var(--gray-l);border-top:none;overflow:hidden}
.prod-card{border-bottom:1px solid #f0f0f0}
.prod-card:last-child{border-bottom:none}
.card-top{display:flex;align-items:flex-start;padding:12px 13px 0;gap:10px}
.letter{width:28px;height:28px;border-radius:50%;background:var(--green-dark);color:white;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.prod-info{flex:1}
.prod-name{font-size:13.5px;font-weight:600;color:#1a2e1a;line-height:1.35}
.prod-sub{font-size:11px;color:var(--gray);margin-top:2px}
.prod-tags{display:flex;gap:4px;margin-top:4px}
.tag{font-size:9px;padding:1px 6px;border-radius:4px;font-weight:700}
.tag-dis{background:#EDE9FE;color:#5B21B6}
.prod-price{text-align:right;flex-shrink:0}
.prod-sale{font-size:15px;font-weight:700;color:var(--red)}
.prod-orig{font-size:10px;color:#9ca3af;text-decoration:line-through;margin-top:2px}
.prod-disc{font-size:9.5px;color:var(--green-mid);font-weight:700;margin-top:1px}
.card-bottom{display:flex;align-items:center;justify-content:space-between;padding:10px 13px 12px;gap:8px}
.qty-label{font-size:12px;color:var(--gray);min-width:28px}
.stepper{display:flex;align-items:center}
.step-btn{width:38px;height:38px;border-radius:50%;border:2px solid var(--gray-l);background:var(--bg);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;user-select:none;transition:background .12s}
.step-btn.minus{color:var(--gray)}
.step-btn.plus{color:var(--green)}
.step-btn:active{background:var(--green-pale);border-color:var(--green-light)}
.step-display{min-width:44px;text-align:center;font-size:18px;font-weight:700;color:#1a2e1a}
.step-display.zero{color:#d1d5db}
.step-sub{font-size:13px;font-weight:700;color:var(--green-mid);min-width:64px;text-align:right}
.step-sub.zero{color:transparent}
.total-bar{position:fixed;bottom:0;left:0;right:0;background:var(--green-dark);color:white;padding:11px 16px;z-index:100;box-shadow:0 -3px 14px rgba(0,0,0,.2)}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.total-lbl{font-size:12px;opacity:.7}
.total-sel{font-size:11px;opacity:.5;margin-top:1px}
.total-amt{font-size:23px;font-weight:700;color:#86efac}
.go-btn{width:100%;padding:13px;background:var(--green-mid);color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.go-btn:disabled{opacity:.3;cursor:not-allowed}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end}
.drawer-bg.open{display:flex}
.drawer{background:white;border-radius:18px 18px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:18px 18px 36px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.drag{width:38px;height:4px;background:var(--gray-l);border-radius:2px;margin:0 auto 16px}
.drawer-title{font-size:17px;font-weight:700;color:var(--green-dark);margin-bottom:4px}
.drawer-note{font-size:12px;color:var(--gray);margin-bottom:14px;line-height:1.5}
.order-box{background:var(--green-faint);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.order-box-title{font-size:10px;font-weight:700;color:var(--green-dark);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.order-row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:#374151}
.order-total{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--red);border-top:1px solid var(--green-light);padding-top:8px;margin-top:6px}
.fg{margin-bottom:12px}
.fl{display:block;font-size:12px;font-weight:700;color:var(--gray);margin-bottom:4px}
.fl.req::after{content:" *";color:var(--red)}
.fi,.fs{width:100%;padding:10px 13px;border:1.5px solid var(--gray-l);border-radius:8px;font-size:15px;color:#1a2e1a;background:white;outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--green-mid)}
.submit-btn{width:100%;padding:13px;background:var(--green-mid);color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
..suc-bg{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#f4f7f4;z-index:9999;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.suc-bg.open{display:flex}
.suc-inner{padding:20px 18px 48px;max-width:560px;margin:0 auto;width:100%}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.suc-icon{font-size:40px;margin-bottom:6px;text-align:center}
.suc-title{font-size:18px;font-weight:700;color:var(--green-dark);margin-bottom:4px;text-align:center}
.suc-sub{font-size:12px;color:var(--gray);text-align:center;margin-bottom:20px}
.step-card{background:white;border-radius:12px;border:1.5px solid var(--gray-l);padding:14px 16px;margin-bottom:10px}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--green-dark);color:white;font-size:12px;font-weight:700;margin-right:8px;flex-shrink:0}
.step-title{font-size:14px;font-weight:700;color:#1a2e1a;display:flex;align-items:center;margin-bottom:10px}
.order-txt-box{background:var(--green-faint);border-radius:8px;padding:12px;font-size:11.5px;color:#374151;line-height:1.8;white-space:pre-wrap;word-break:break-all;border:1px solid var(--green-light);margin-bottom:10px}
.btn-copy-order{width:100%;padding:10px;background:var(--green-pale);color:var(--green-dark);border:1.5px solid var(--green-light);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.btn-line{width:100%;padding:14px;background:#06C755;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.step-hint{font-size:12px;color:var(--gray);margin-top:8px;line-height:1.6}
.radio-row{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.radio-opt{display:flex;align-items:center;gap:10px;font-size:14px;color:#1a2e1a;padding:10px 13px;border:1.5px solid var(--gray-l);border-radius:8px;cursor:pointer;transition:border-color .15s,background .15s}
.radio-opt:has(input:checked){border-color:var(--green-mid);background:var(--green-faint)}
.radio-opt input[type=radio]{width:18px;height:18px;accent-color:var(--green-mid);cursor:pointer;flex-shrink:0}
.btn-again{width:100%;padding:11px;background:var(--bg);border:1.5px solid var(--gray-l);border-radius:10px;font-size:13px;color:var(--gray);cursor:pointer;font-weight:600}
.credit-bar{background:#FEF3C7;border-top:3px solid #F59E0B;border-bottom:3px solid #F59E0B;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.credit-label{font-size:15px;color:#92400E;font-weight:700;flex:1}
.credit-sub{font-size:12px;color:#B45309;margin-top:3px}
.credit-toggle{display:flex;align-items:center;gap:8px}
.cred-sw{width:52px;height:30px;border-radius:15px;background:#D1D5DB;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.cred-sw.on{background:#D97706}
.cred-sw-k{width:24px;height:24px;border-radius:50%;background:white;position:absolute;top:3px;left:3px;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.cred-sw.on .cred-sw-k{left:25px}
.credit-toggle-lbl{font-size:14px;font-weight:700;color:#92400E;min-width:48px}
.total-detail{font-size:11px;opacity:.6;margin-top:1px}
</style>
</head>

    {id:'H', name:'塑膠手搖鈴',        price:100, orig:140,  sub:'三色可選'},
    {id:'I', name:'6吋特殊鋼三角鐵',   price:260, orig:360},
    {id:'J', name:'手指銅鈸',          price:260, orig:360},
    {id:'K', name:'水果沙鈴',          price:660, orig:870,  sub:'加贈提籃'},
    {id:'L', name:'8音桌上音磚',       price:960, orig:1400, sub:'木盒'},
  ]},
  { name:'預購專區', desc:'限時預購優惠 · 數量有限', products:[
    {id:'M', name:'好森紀念T（成人款）', price:580, orig:680, tag:'預購', sub:'6月到貨 · 2件以上 $500／件'},
    {id:'N', name:'好森紀念T（兒童款）', price:580, orig:680, tag:'預購', sub:'6月到貨 · 2件以上 $500／件'},
    {id:'O', name:'PlayMe 響叮噹 8音',   price:4980,orig:6800,tag:'預購', sub:'10月到貨 · 限時預購優惠'},
  ]},
];

let qty={}, lastTxt='', useCredit=false;

function render(){
  document.getElementById('area').innerHTML = BRANDS.map(b=>
    `<div class="brand-block">
      <div class="brand-hdr">
        <span class="brand-name">${b.name}</span>
        <span class="brand-desc">${b.desc}</span>
      </div>
      <div class="prod-list">${b.products.map(renderCard).join('')}</div>
    </div>`
  ).join('');
}

function renderCard(p){
  const q=qty[p.id]||0, disc=Math.round((1-p.price/p.orig)*100);
  const isTshirt = TSHIRT_IDS.includes(p.id);
  const effP = effectivePrice(p.id);
  const discountOn = isTshirt && tshirtDiscountActive();
  const subAmt = q > 0 ? effP * q : 0;
  return `<div class="prod-card" id="card-${p.id}">
    <div class="card-top">
      <div class="letter">${p.id}</div>
      <div class="prod-info">
        <div class="prod-name">${p.name}</div>
        ${p.sub?`<div class="prod-sub">${p.sub}</div>`:''}
        <div class="prod-tags">
          ${p.tag?`<span class="tag tag-dis">${p.tag}</span>`:''}
          ${discountOn?'<span class="tag" style="background:#FEF3C7;color:#92400E">2件優惠 $500</span>':''}
        </div>
      </div>
      <div class="prod-price">
        <div class="prod-sale" id="price-${p.id}">${discountOn?'<s style='font-size:11px;color:#9ca3af'>$580</s> <span style='color:var(--red)'>$500</span>':'$'+p.price.toLocaleString()}</div>
        <div class="prod-orig">$${p.orig.toLocaleString()}</div>
        <div class="prod-disc">省${disc}%</div>
      </div>
    </div>
    <div class="card-bottom">
      <span class="qty-label">數量</span>
      <div class="stepper">
        <button class="step-btn minus" onclick="chg('${p.id}',-1)">－</button>
        <span class="step-display ${q===0?'zero':''}" id="n-${p.id}">${q}</span>
        <button class="step-btn plus" onclick="chg('${p.id}',1)">＋</button>
      </div>
      <span class="step-sub ${q===0?'zero':''}" id="sub-${p.id}">${subAmt>0?'$'+subAmt.toLocaleString():''}</span>
    </div>
  </div>`;
}

function chg(id,d){
  const p=findP(id); if(!p)return;
  qty[id]=Math.max(0,(qty[id]||0)+d);
  const q=qty[id];
  // If T-shirt, re-render both T-shirt cards to update discount state
  if(TSHIRT_IDS.includes(id)){
    TSHIRT_IDS.forEach(tid => {
      const card = document.getElementById('card-'+tid);
      if(card){
        const tp = findP(tid);
        if(tp){
          const tq = qty[tid]||0;
          card.outerHTML = renderCard(tp);
        }
      }
    });
  } else {
    const ne=document.getElementById('n-'+id), se=document.getElementById('sub-'+id);
    if(ne){ne.textContent=q; ne.className='step-display'+(q===0?' zero':'');}
    if(se){const ep=effectivePrice(id);se.textContent=q>0?'$'+(ep*q).toLocaleString():''; se.className='step-sub'+(q===0?' zero':'');}
  }
  updateTotal();
}
function findP(id){for(const b of BRANDS)for(const p of b.products)if(p.id===id)return p;}

// T-shirt 2件以上優惠 $500/件
const TSHIRT_IDS = ['M','N'];
function effectivePrice(id){
  const p = findP(id);
  if(!p) return 0;
  if(TSHIRT_IDS.includes(id)){
    const totalTshirts = TSHIRT_IDS.reduce((s,tid)=>s+(qty[tid]||0), 0);
    return totalTshirts >= 2 ? 500 : p.price;
  }
  return p.price;
}
function tshirtDiscountActive(){
  return TSHIRT_IDS.reduce((s,tid)=>s+(qty[tid]||0), 0) >= 2;
}
function getSel(){return Object.keys(qty).filter(id=>qty[id]>0).map(id=>({...findP(id),qty:qty[id],effPrice:effectivePrice(id)})).filter(Boolean);}
function toggleCredit(){
  useCredit=!useCredit;
  const sw=document.getElementById('credSw');
  const lbl=document.getElementById('credLbl');
  const sub=document.getElementById('creditSubtxt');
  sw.classList.toggle('on', useCredit);
  lbl.textContent = useCredit ? '使用中' : '不使用';
  sub.textContent = useCredit ? '已折抵 $300，將從合計中扣除' : '點右側開關即可折抵';
  updateTotal();
}
function updateTotal(){
  const sel=getSel();
  const subtotal=sel.reduce((s,p)=>s+(p.effPrice||p.price)*p.qty,0);
  const count=sel.reduce((s,p)=>s+p.qty,0);
  const discount = (useCredit && subtotal>0) ? 300 : 0;
  const total = Math.max(0, subtotal - discount);
  document.getElementById('totalAmt').textContent='$'+total.toLocaleString();
  const detailEl=document.getElementById('totalDetail');
  if(discount>0){
    detailEl.textContent=`商品 $${subtotal.toLocaleString()} － 購物金 $300`;
  } else {
    detailEl.textContent='';
  }
  document.getElementById('selSummary').textContent=count>0?`已選 ${count} 件商品`:'尚未選擇商品';
  document.getElementById('goBtn').disabled=count===0;
}
function openDrawer(){
  const sel=getSel(); if(!sel.length)return;
  const subtotal=sel.reduce((s,p)=>s+(p.effPrice||p.price)*p.qty,0);
  const total=Math.max(0, subtotal - (useCredit?300:0));
  document.getElementById('orderBox').innerHTML=
    '<div class="order-box-title">你的選購清單</div>'+
    sel.map(p=>`<div class="order-row"><span>${p.id}. ${p.name} ×${p.qty}</span><span>$${(p.price*p.qty).toLocaleString()}</span></div>`).join('')+
    `<div class="order-total"><span>合計</span><span>$${total.toLocaleString()}</span></div>`;
  // Reset credit radio to match current state
  const radios = document.querySelectorAll('input[name="formCredit"]');
  radios.forEach(r => r.checked = (r.value === (useCredit?'yes':'no')));
  const note = document.getElementById('formCreditNote');
  if(note) note.style.display = useCredit ? 'block' : 'none';
  document.getElementById('drawerBg').classList.add('open');
}
function submitOrder(){
  const name=document.getElementById('fName').value.trim();
  const line=document.getElementById('fLine').value.trim();
  const pickup=document.getElementById('fPickup').value;
  const note=document.getElementById('fNote').value.trim();
  const credit = useCredit ? '使用 $300 購物金' : '不使用';
  const payment=document.querySelector('input[name="payment"]:checked')?.value||'';
  const sel=getSel();
  if(!name){alert('請填寫小朋友稱呼');document.getElementById('fName').focus();return;}
  if(!line){alert('請填寫 LINE 暱稱');document.getElementById('fLine').focus();return;}
  const now=new Date(), ds=`${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  const subtotal=sel.reduce((s,p)=>s+(p.effPrice||p.price)*p.qty,0);
  const total=Math.max(0,subtotal-(useCredit?300:0));
  const lines=sel.map(p=>`${p.id}. ${p.name} x${p.qty}  $${((p.effPrice||p.price)*p.qty).toLocaleString()}${TSHIRT_IDS.includes(p.id)&&tshirtDiscountActive()?' (2件優惠價$500/件)':''}`).join('\n');
  lastTxt=`【好森嚴選 五月號登記】\n時間：${ds}\n稱呼：${name}\nLINE：${line}${pickup?'\n取貨：'+pickup:''}\n付款：${payment}${credit==='使用 $300 購物金'?'\n購物金：使用 $300':''}\n────────────\n${lines}\n────────────\n合計：$${total.toLocaleString()}${note?'\n備註：'+note:''}\n（請將此訊息傳給好森嚴選確認）`;
  if(SHEETS_URL)fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({ds,name,line,pickup,payment,credit,note,items:lines,total})}).catch(()=>{});
  document.getElementById('drawerBg').classList.remove('open');
  document.getElementById('sucMsg').textContent=`${name} 您好，合計 $${total.toLocaleString()}，請照以下步驟完成傳送`;
  document.getElementById('orderTxtBox').textContent=lastTxt;
  document.getElementById('sucBg').classList.add('open');
  document.getElementById('creditBar').style.display='none';
  document.getElementById('totalBarWrap').style.display='none';
  document.body.style.overflow='hidden';
  document.getElementById('sucBg').scrollTop=0;
}
function toggleFormCredit(use){
  useCredit = use;
  updateTotal();
  const note = document.getElementById('formCreditNote');
  if(note) note.style.display = use ? 'block' : 'none';
  // Update order summary in form
  const sel = getSel();
  const total = Math.max(0, sel.reduce((s,p)=>s+p.price*p.qty,0) - (use?300:0));
  const subtotal = sel.reduce((s,p)=>s+p.price*p.qty,0);
  const box = document.getElementById('orderBox');
  if(box){
    const discountRow = use ? `<div class="order-row" style="color:var(--green-mid)"><span>🎁 購物金折抵</span><span>－$300</span></div>` : '';
    box.innerHTML =
      '<div class="order-box-title">你的選購清單</div>' +
      sel.map(p=>`<div class="order-row"><span>${p.id}. ${p.name} ×${p.qty}</span><span>$${(p.price*p.qty).toLocaleString()}</span></div>`).join('') +
      discountRow +
      `<div class="order-total"><span>合計</span><span>$${total.toLocaleString()}</span></div>`;
  }
}
function openLine(){
  const mob=/Android|iPhone|iPad/i.test(navigator.userAgent);
  window.open(mob ? 'line://ti/p/@ffz5958f' : 'https://line.me/R/ti/p/@ffz5958f', '_blank');
}
function copyOrder(){
  const btn=document.getElementById('copyBtn');
  const doFeedback=()=>{if(btn){btn.textContent='✅ 已複製！';btn.style.background='var(--green-pale)';setTimeout(()=>{btn.textContent='📋 點此複製訂單明細';},2500);}};
  if(navigator.clipboard){navigator.clipboard.writeText(lastTxt).then(doFeedback).catch(()=>{fallbackCopy();doFeedback();});}
  else{fallbackCopy();doFeedback();}
}
function fallbackCopy(){const ta=document.createElement('textarea');ta.value=lastTxt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
function resetAll(){
  qty={};
  document.getElementById('sucBg').classList.remove('open');
  document.getElementById('creditBar').style.display='';
  document.getElementById('totalBarWrap').style.display='';
  document.body.style.overflow='';
  useCredit=false;
  const sw=document.getElementById('credSw');
  const lbl=document.getElementById('credLbl');
  const sub=document.getElementById('creditSubtxt');
  if(sw) sw.classList.remove('on');
  if(lbl) lbl.textContent='不使用';
  if(sub) sub.textContent='點右側開關即可折抵';
  ['fName','fLine','fNote'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  const payment=document.querySelector('input[name="payment"]');
  if(payment) document.querySelectorAll('input[name="payment"]').forEach((r,i)=>r.checked=i===0);
  document.querySelectorAll('input[name="formCredit"]').forEach(r=>r.checked=r.value==='no');
  const fcNote=document.getElementById('formCreditNote');
  if(fcNote) fcNote.style.display='none';
  render();
  updateTotal();
}
render(); updateTotal();
</script>
